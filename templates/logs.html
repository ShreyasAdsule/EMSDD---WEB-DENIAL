<!doctype html>
<title>System Logs</title>
<h2>System Logs (last 100 requests)</h2>
<ul>
{% for log in logs %}
    <li>{{ log }}</li>
{% endfor %}
</ul>
<h2>Messages to Admin</h2>
<ul>
{% for m in messages %}
    <li>{{ m.time }} {{ m.user }}: {{ m.msg }}</li>
{% endfor %}
</ul>
<a href="{{ url_for('dashboard') }}">Back</a>
