{% extends 'base.html' %}
{% block content %}
<h2>Inbox</h2>
<ul class="list-group mb-4">
  {% for msg in inbox %}
    <li class="list-group-item">
      From: {{ msg.sender.username }} | {{ msg.timestamp.strftime("%Y-%m-%d %H:%M") }}<br>
      {{ msg.content }}
    </li>
  {% else %}
    <li class="list-group-item">No messages yet.</li>
  {% endfor %}
</ul>

<h3>Send a Message</h3>
<form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-2">
    <label for="recipient">Recipient:</label>
    <select name="recipient" class="form-select" id="recipient">
      {% for u in users %}
        {% if u.id != current_user.id %}
          <option value="{{ u.username }}">{{ u.username }}</option>
        {% endif %}
      {% endfor %}
    </select>
  </div>
  <div class="mb-2">
    <label for="content">Message:</label>
    <textarea name="content" class="form-control" id="content" required></textarea>
  </div>
  <button type="submit" class="btn btn-primary">Send</button>
</form>
{% endblock %}
