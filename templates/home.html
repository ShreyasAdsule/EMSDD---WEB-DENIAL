{% extends 'base.html' %}

{% block content %}
<div class="text-center mt-5">
    <h1>Welcome to SecureApp</h1>
    {% if user %}
        <p>Hello, {{ user.username }}! Go to your <a href="{{ url_for('dashboard') }}">Dashboard</a>.</p>
    {% else %}
        <p><a href="{{ url_for('login') }}">Login</a> or <a href="{{ url_for('register') }}">Register</a></p>
    {% endif %}
</div>
{% endblock %}
